name: fresh-image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: create fresh tag
        id: tag
        run: echo "tag=fresh-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: set up buildx
        uses: docker/setup-buildx-action@v3
      - name: log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build and push fresh image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          pull: true
          tags: ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.tag }}
          # Layer cache across runs. Combined with cargo-chef in the
          # Dockerfile, a source-only change reuses the dependency build.
          cache-from: type=gha,scope=dhi-image
          cache-to: type=gha,mode=max,scope=dhi-image

  verify-pull:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: pull and verify image
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ needs.build.outputs.tag }}
        run: |
          for attempt in 1 2 3 4 5; do
            if docker pull "$IMAGE"; then
              break
            fi
            if [ "$attempt" = "5" ]; then
              exit 1
            fi
            sleep 10
          done
          docker run --rm --entrypoint sh "$IMAGE" -c 'test -f /app/web/out/index.html && test -x /usr/local/bin/dhi-server && test -x /usr/local/bin/docker && echo fresh-image-ok'
