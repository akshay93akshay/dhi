name: ci

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-14
    env:
      DATABASE_URL: postgres://dhi_test:dhi_test@127.0.0.1:5432/dhi
      MIGRATION_DATABASE_URL: postgres://dhi_owner:dhi_owner@127.0.0.1:5432/dhi
      TEST_DATABASE_URL: postgres://dhi_test:dhi_test@127.0.0.1:5432/dhi
    steps:
      - uses: actions/checkout@v4

      - name: toolchain
        uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos

      - name: postgres
        run: |
          brew install postgresql@16
          export PATH="$(brew --prefix postgresql@16)/bin:$PATH"
          initdb -D "$RUNNER_TEMP/pgdata" -U dhi_owner --auth=trust
          pg_ctl -D "$RUNNER_TEMP/pgdata" -l "$RUNNER_TEMP/pg.log" start
          createdb -h 127.0.0.1 -p 5432 -U dhi_owner dhi
          psql "postgres://dhi_owner@127.0.0.1:5432/dhi" -v ON_ERROR_STOP=1 -f ops/postgres/01-roles.sql
          pg_isready -h 127.0.0.1 -p 5432 -U dhi_owner -d dhi

      - name: fmt
        run: cargo fmt --all -- --check

      - name: test
        run: cargo test --workspace --locked

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: build server
        run: cargo build -p dhi-server --locked

      - name: sandbox
        run: bash scripts/check-sandbox.sh

      - name: stop postgres
        if: always()
        run: '"$(brew --prefix postgresql@16)/bin/pg_ctl" -D "$RUNNER_TEMP/pgdata" stop -m fast'

  hygiene:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: secret check
        run: bash scripts/check-secrets.sh
      - name: stale check
        run: bash scripts/check-stale.sh
      - name: path check
        run: bash scripts/check-paths.sh

  web:
    runs-on: macos-14
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: install
        run: npm ci
      - name: test
        run: npm test
      - name: build
        env:
          NEXT_EXPORT: "1"
        run: npm run build
