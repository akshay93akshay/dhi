# Optional override for the host file browser.
#
# Set DHI_FILE_BROWSER_ROOT to an absolute host path, then start or update
# the stack with both files:
#
#   docker compose -f docker-compose.yml -f docker-compose.fs.yml up -d
#
# The root is mounted at the same absolute path, read-write, because the
# Docker daemon resolves each task's project bind mount on the host. Do not
# apply this override while DHI_FILE_BROWSER_ROOT is unset: Compose would try
# to create an empty bind mount. See docs/project-file-browser.md.
services:
  dhi-server:
    volumes:
      - ${DHI_FILE_BROWSER_ROOT}:${DHI_FILE_BROWSER_ROOT}
