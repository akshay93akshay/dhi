services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dhi_owner
      POSTGRES_PASSWORD: dhi_owner
      POSTGRES_DB: dhi
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dhi_owner -d dhi"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  dhi-server:
    build: .
    image: ${DHI_IMAGE:-dhi:local}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://dhi_app:dhi_app@postgres:5432/dhi
      MIGRATION_DATABASE_URL: postgres://dhi_owner:dhi_owner@postgres:5432/dhi
      DHI_BIND: 0.0.0.0:8080
      DHI_WEB_DIR: /app/web/out
      DHI_WORKSPACE_ROOT: /app/workspace
      DHI_WORKSPACE_HOST_ROOT: ${DHI_WORKSPACE_HOST_ROOT:-${PWD}/workspace}
      DHI_PROJECT_FOLDERS: ${DHI_PROJECT_FOLDERS:-}
      DHI_FILE_BROWSER_ROOT: ${DHI_FILE_BROWSER_ROOT:-}
      RUST_LOG: dhi=info,tower_http=info
      DHI_LLM_BASE_URL: ${DHI_LLM_BASE_URL:-}
      DHI_LLM_API_KEY: ${DHI_LLM_API_KEY:-}
      DHI_LLM_PLANNER_MODEL: ${DHI_LLM_PLANNER_MODEL:-}
      DHI_LLM_WORKER_MODEL: ${DHI_LLM_WORKER_MODEL:-}
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8090:8090"
    volumes:
      - ./workspace:/app/workspace
      - /var/run/docker.sock:/var/run/docker.sock
      # Legacy project folders from DHI_PROJECT_FOLDERS: mount each folder at
      # the same absolute path, read-write, so tasks created before the file
      # browser still resolve their projects. Repeat one line per folder. New
      # tasks select a folder through the file browser instead. See README
      # "Project folders and AGENTS.md". Example:
      # - /srv/projects/build:/srv/projects/build
      #
      # The host file browser needs DHI_FILE_BROWSER_ROOT mounted at the same
      # absolute path, read-write. Use docker-compose.fs.yml, which only
      # applies when that variable is set. See docs/project-file-browser.md.
    restart: unless-stopped

volumes:
  pgdata:
