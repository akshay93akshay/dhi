# MCP: the client SDK behind rig's `rmcp` feature. rig-rmcp 0.45.0
# builds against rmcp 3.8.0 (features `client`); the direct dependency exists
# only for the transports rig-rmcp does not enable (`transport-child-process`
# for stdio servers and `transport-streamable-http-client-reqwest` for HTTP
# ones). Feature unification keeps one rmcp across both.
rmcp = { version = "3.8.0", default-features = false, features = [
  "client",
  "transport-child-process",
  "transport-streamable-http-client-reqwest",
] }
# Prompt hash of the specialist audit rows (same short-hash shape as the
# engine's `agent_runs.prompt_hash`).
sha2.workspace = true

