# Optional override for browser-folder web projects.
#
# Set DHI_WEB_PROJECTS_ROOT to an absolute host path, then start or update
# the stack with both files:
#
#   docker compose -f docker-compose.yml -f docker-compose.web.yml up -d
#
# The root is mounted at the same absolute path, read-write, because the
# Docker daemon resolves each task's project bind mount on the host. Do not
# use this override while DHI_WEB_PROJECTS_ROOT is unset: Compose would try
# to create an empty bind mount. See docs/deploy-web-projects.md.
services:
  dhi-server:
    volumes:
      - ${DHI_WEB_PROJECTS_ROOT}:${DHI_WEB_PROJECTS_ROOT}
